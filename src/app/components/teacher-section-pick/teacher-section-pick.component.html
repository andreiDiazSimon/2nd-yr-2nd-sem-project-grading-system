<div class="p-4">
  <button
    routerLink="/teacher/section"
    class="cursor-pointer mb-4 text-sm text-gray-600 hover:text-gray-800 transition duration-300"
  >
    ← Back
  </button>

  <div *ngIf="students.length > 0; else noStudents">
    <h2 class="text-xl font-semibold mb-4">
      Students in Section: {{ section }}
    </h2>

    <div class="flex items-center gap-4 mb-4">
      <!-- Dropdown for Term Selection -->
      <label class="block">
        <span class="text-gray-700">Select Term:</span>
        <select
          [(ngModel)]="selectedTerm"
          class="block mt-1 p-2 border border-gray-300 rounded"
        >
          <option value="Prelim">Prelim</option>
          <option value="Midterm">Midterm</option>
          <option value="Finals">Final</option>
        </select>
      </label>
    </div>

    <!-- Grid Header -->
    <div class="grid grid-cols-11 font-bold border-b pb-2 mb-2">
      <div>Student ID</div>
      <div>Username</div>
      <div>Term</div>
      <div>Week 1</div>
      <div>Week 2</div>
      <div>Week 3</div>
      <div>Week 4</div>
      <div>Week 5</div>
      <div>Exam</div>
      <div>Action</div>
      <div>General Average</div>
    </div>

    <!-- Grid Rows for Students -->
    <ng-container *ngFor="let student of students">
      <ng-container *ngFor="let grade of student.grades">
        <div
          class="grid grid-cols-11 border-b py-2 text-sm"
          *ngIf="grade.term === selectedTerm"
        >
          <div class="text-center">{{ student.id }}</div>
          <div class="text-center">{{ student.username }}</div>
          <div>{{ grade.term }}</div>

          <!-- Week 1 Grade Input -->
          <div>
            <input
              [(ngModel)]="grade.week1"
              type="number"
              class="w-16 px-2 py-1 border rounded"
            />
          </div>

          <!-- Week 2 Grade -->
          <div>
            <input
              [(ngModel)]="grade.week2"
              type="number"
              class="w-16 px-2 py-1 border rounded"
            />
          </div>

          <!-- Week 3 Grade -->
          <div>
            <input
              [(ngModel)]="grade.week3"
              type="number"
              class="w-16 px-2 py-1 border rounded"
            />
          </div>

          <!-- Week 4 Grade -->
          <div>
            <input
              [(ngModel)]="grade.week4"
              type="number"
              class="w-16 px-2 py-1 border rounded"
            />
          </div>

          <!-- Week 5 Grade -->
          <div>
            <input
              [(ngModel)]="grade.week5"
              type="number"
              class="w-16 px-2 py-1 border rounded"
            />
          </div>

          <!-- Exam Grade -->
          <div>
            <input
              [(ngModel)]="grade.exam"
              type="number"
              class="w-16 px-2 py-1 border rounded"
            />
          </div>

          <div>
            <input
              type="button"
              value="Save"
              (click)="updateGrade(student.id, grade)"
              class="cursor-pointer bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 transition duration-300"
            />
          </div>

          <!-- Display Raw Grade -->
          <div>{{ calculateRawGrade(grade) }}</div>
        </div>
      </ng-container>
    </ng-container>
  </div>

  <ng-template #noStudents>
    <p>No students found for this section.</p>
  </ng-template>
</div>
