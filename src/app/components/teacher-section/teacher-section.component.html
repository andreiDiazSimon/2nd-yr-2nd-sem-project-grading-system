<div class="p-6">
  <!-- Back Button -->
  <button
    routerLink="/teacher"
    class="cursor-pointer text-sm text-gray-600 hover:text-gray-800 mb-6 flex items-center"
  >
    ← Back
  </button>

  <!-- Title -->
  <h1 class="text-2xl font-semibold mb-6">Pick a Section</h1>

  <!-- Section List -->
  <ul class="space-y-4">
    <li *ngFor="let section of sections">
      <button
        (click)="go(section)"
        class="w-full text-left p-3 border border-gray-300 rounded-lg hover:bg-gray-100 transition duration-300"
      >
        {{ section }}
      </button>
    </li>
  </ul>
</div>
