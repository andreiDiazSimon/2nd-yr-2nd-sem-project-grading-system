<div class="p-6">
  <!-- Back Button -->
  <div
    routerLink="../"
    class="text-blue-500 hover:text-blue-700 font-mono cursor-pointer mb-4"
  >
    ← Back
  </div>

  <!-- Section Title -->
  <div class="text-2xl font-semibold mb-4">Sections</div>

  <!-- Section List -->
  <div *ngFor="let section of sections">
    <div
      (click)="onSectionClick(section)"
      class="cursor-pointer p-4 border border-gray-300 rounded-lg mb-3 shadow-md hover:bg-gray-100 transition duration-300"
    >
      <div class="font-medium text-lg">{{ section }}</div>
    </div>
  </div>
</div>
